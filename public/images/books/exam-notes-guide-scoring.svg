<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Leather Hardcover Radial Gradient -->
    <radialGradient id="leatherGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#200c01" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Gold Foil Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Top Studio Lighting Overlay -->
    <linearGradient id="studioLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </linearGradient>

    <!-- Deep Emboss Drop Shadow for Gold Inlay -->
    <filter id="goldEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fef08a" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&amp;family=Noto+Nastaliq+Urdu:wght@700&amp;display=swap');
    .gold-text { font-family: 'Amiri', 'Traditional Arabic', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
    .gold-urdu { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
  </style>

  <!-- 1. Rich Leather Hardcover Base -->
  <rect width="400" height="600" rx="6" fill="url(#leatherGrad)" />

  <!-- 2. Leather Fine Grain Texture Overlay -->
  <rect width="400" height="600" rx="6" fill="url(#studioLight)" />

  <!-- 3. Outer Gold Border Frame (Double Rim) -->
  <rect x="14" y="14" width="372" height="572" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <rect x="20" y="20" width="360" height="560" rx="4" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="6,3" />
  <rect x="25" y="25" width="350" height="550" rx="3" fill="none" stroke="url(#goldBorder)" stroke-width="1.8" />

  <!-- 4. Ornate Islamic Corner Rosettes -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5">
    <path d="M 26,48 Q 48,48 48,26" />
    <circle cx="38" cy="38" r="4" fill="url(#goldGrad)" />
    <path d="M 374,48 Q 352,48 352,26" />
    <circle cx="362" cy="38" r="4" fill="url(#goldGrad)" />
    <path d="M 26,552 Q 48,552 48,574" />
    <circle cx="38" cy="562" r="4" fill="url(#goldGrad)" />
    <path d="M 374,552 Q 352,552 352,574" />
    <circle cx="362" cy="562" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- 5. Top Header: Bismillah Crest -->
  <g transform="translate(200, 68)" text-anchor="middle">
    <text class="gold-text" font-size="18" letter-spacing="1">بِسْمِ اللَّهِ الرَّحْمٰنِ الرَّحِيمِ</text>
    <path d="M -80,14 L 80,14" stroke="url(#goldGrad)" stroke-width="1" />
    <circle cx="0" cy="14" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- 6. Category Arch Cartouche (Mihrab Style) -->
  <g transform="translate(200, 118)">
    <path d="M -110,-14 Q 0,-28 110,-14 L 100,16 Q 0,4 -100,16 Z" fill="#000000" fill-opacity="0.3" stroke="url(#goldBorder)" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="gold-text" font-size="13" letter-spacing="1.5">امتحانی پرچہ جات و حل شدہ نوٹس</text>
  </g>

  <!-- 7. Central Ornate 8-Pointed Star Medallion (Shamsa) -->
  <g transform="translate(200, 270)">
    <circle cx="0" cy="0" r="105" fill="#000000" fill-opacity="0.38" stroke="url(#goldBorder)" stroke-width="2" />
    <circle cx="0" cy="0" r="99" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="4,3" />
    <rect x="-70" y="-70" width="140" height="140" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" transform="rotate(45)" />
    <rect x="-70" y="-70" width="140" height="140" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" />

    <!-- Main Book Title (Arabic) in Central Star -->
    <text text-anchor="middle" y="-12" class="gold-text" font-size="22" letter-spacing="0.5">دليل التفوق والامتياز</text>
    
    <!-- Decorative Center Divider -->
    <path d="M -50,6 L 50,6" stroke="url(#goldGrad)" stroke-width="1.2" />
    <circle cx="0" cy="6" r="2.5" fill="url(#goldGrad)" />

    <!-- Book Title (Urdu) -->
    <text text-anchor="middle" y="32" class="gold-urdu" font-size="14">امتحانی رہنما اصول و رازِ کامیابی</text>
  </g>

  <!-- 8. Details Cartouche (Subject & Board) -->
  <g transform="translate(200, 422)">
    <rect x="-140" y="-18" width="280" height="52" rx="6" fill="#000000" fill-opacity="0.35" stroke="url(#goldBorder)" stroke-width="1.2" />
    <text text-anchor="middle" y="2" class="gold-urdu" font-size="11.5">وقت کی تقسیم، اعراب، اور ممتحن کے خصوصی رہنما نوٹس</text>
    <text text-anchor="middle" y="24" class="gold-text" font-size="12" fill="url(#goldGrad)">شعبۂ امتحانات، تحریکِ ایمان</text>
  </g>

  <!-- 9. Bottom Publisher Verification Seal -->
  <g transform="translate(200, 520)" text-anchor="middle">
    <path d="M -90,0 L 90,0" stroke="url(#goldGrad)" stroke-width="0.8" />
    <polygon points="0,-6 -6,0 0,6 6,0" fill="url(#goldGrad)" />
    <text y="22" class="gold-text" font-size="11" letter-spacing="1">طبع معتمد | دار الإشاعت الإسلامية</text>
    <text y="38" class="gold-urdu" font-size="10" fill="#facc15" fill-opacity="0.85">تحریکِ ایمان • امتحانی و تدریسی شعبہ</text>
  </g>
</svg>