<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Leather Texture / Shading Gradient -->
    <radialGradient id="leatherGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#525252" />
      <stop offset="60%" stop-color="#262626" />
      <stop offset="100%" stop-color="#171717" />
    </radialGradient>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Gold Foil Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Top Studio Spotlight Glow -->
    <linearGradient id="studioLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Deep Emboss Drop Shadow -->
    <filter id="goldEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fef08a" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&amp;family=Noto+Nastaliq+Urdu:wght@700&amp;display=swap');
    .gold-text { font-family: 'Amiri', 'Traditional Arabic', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
    .gold-urdu { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
  </style>

  <!-- 1. Rich Leather Hardcover Base -->
  <rect width="400" height="600" rx="6" fill="url(#leatherGrad)" />

  <!-- 2. Leather Fine Grain Texture Overlay -->
  <rect width="400" height="600" rx="6" fill="url(#studioLight)" />

  <!-- 3. Outer Gold Border Frame (Double Rim) -->
  <rect x="14" y="14" width="372" height="572" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <rect x="20" y="20" width="360" height="560" rx="4" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="6,3" />
  <rect x="25" y="25" width="350" height="550" rx="3" fill="none" stroke="url(#goldBorder)" stroke-width="1.8" />

  <!-- 4. Ornate Islamic Corner Rosettes -->
  <!-- Top-Left -->
  <g transform="translate(25, 25)">
    <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
    <path d="M 0,38 L 38,0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>
  <!-- Top-Right -->
  <g transform="translate(375, 25) scale(-1, 1)">
    <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
    <path d="M 0,38 L 38,0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(25, 575) scale(1, -1)">
    <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
    <path d="M 0,38 L 38,0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(375, 575) scale(-1, -1)">
    <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
    <path d="M 0,38 L 38,0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- 5. Top Bismillah & Header Crest -->
  <g transform="translate(200, 58)" text-anchor="middle">
    <!-- Mini Crescent / Star Motif -->
    <path d="M -12,-18 A 6,6 0 0,0 12,-18 A 8,8 0 1,1 -12,-18 Z" fill="url(#goldGrad)" />
    <text y="5" font-size="16" class="gold-text" letter-spacing="1">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  </g>

  <!-- Category Arch Cartouche -->
  <g transform="translate(200, 95)">
    <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#171717" stroke="url(#goldBorder)" stroke-width="1.2" />
    <text text-anchor="middle" y="4" font-size="11" class="gold-text" letter-spacing="0.5">التَّارِيخُ الإِسْلَامِيُّ وَالتَّرَاجِمُ</text>
  </g>

  <!-- 6. Central Ornate Medallion (شمسة مذهبة) -->
  <g transform="translate(200, 255)">
    <!-- Outer Medallion Rays -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
    <circle cx="0" cy="0" r="122" fill="none" stroke="url(#goldBorder)" stroke-width="1.8" opacity="0.8" />
    <circle cx="0" cy="0" r="115" fill="#171717" stroke="url(#goldBorder)" stroke-width="2.5" opacity="0.95" />
    <circle cx="0" cy="0" r="108" fill="#262626" stroke="url(#goldBorder)" stroke-width="1.2" />

    <!-- Islamic Geometric Eight-Pointed Star Filigree -->
    <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.35">
      <rect x="-65" y="-65" width="130" height="130" rx="4" />
      <rect x="-65" y="-65" width="130" height="130" rx="4" transform="rotate(45)" />
    </g>

    <!-- Main Arabic Book Title -->
    <text text-anchor="middle" y="-18" font-size="26" class="gold-text">
      رجال الفكر والدعوة في الإسلام لأبي الحسن الندوي
    </text>

    <!-- Subtle Gold Divider Bar -->
    <path d="M -70,5 L -12,5 M 12,5 L 70,5" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="0" cy="5" r="4" fill="url(#goldGrad)" />

    <!-- Urdu Title -->
    <text text-anchor="middle" y="42" font-size="22" class="gold-urdu">
      تاریخ دعوت و عزیمت
    </text>

    <!-- Subtitle / Hadith Description -->
    <text text-anchor="middle" y="74" font-size="11" class="gold-text" opacity="0.95">
      طبعة محققة معتمدة
    </text>
  </g>

  <!-- 7. Author Cartouche / Ribbon -->
  <g transform="translate(200, 435)">
    <path d="M -135,-14 L 135,-14 Q 145,-14 145,0 Q 145,14 135,14 L -135,14 Q -145,14 -145,0 Q -145,-14 -135,-14 Z" 
          fill="#171717" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text text-anchor="middle" y="4" font-size="12" class="gold-text">
      تَأْلِيفُ: مفکرِ اسلام مولانا سید ابو الحسن علی حسنی ندوی
    </text>
  </g>

  <!-- 8. Publisher / Academic Verification Seal (تحریکِ ایمان) -->
  <g transform="translate(200, 520)" text-anchor="middle">
    <!-- Star Ornaments -->
    <text y="-18" font-size="10" class="gold-text" letter-spacing="4">★ ★ ★</text>
    <text y="0" font-size="11.5" class="gold-text">
      تَحْرِيكِ إِيمَان — مَكْتَبَةُ الدِّرَاسَاتِ الإِسْلَامِيَّة
    </text>
    <text y="18" font-size="9.5" class="gold-text" opacity="0.85">
      مُصَدَّقٌ وَمُعْتَمَدٌ كَامِلاً • طَبْعَةٌ فَاخِرَةٌ
    </text>
  </g>

  <!-- 9. Spine Hinge Simulation Line (Left edge shadow) -->
  <rect x="0" y="0" width="16" height="600" fill="black" opacity="0.28" />
  <line x1="16" y1="0" x2="16" y2="600" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

</svg>