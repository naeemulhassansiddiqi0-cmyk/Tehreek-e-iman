<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Rich Royal Emerald Leather Radial Background -->
    <radialGradient id="leatherGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="80%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011b15" />
    </radialGradient>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Gold Foil Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Top Studio Spotlight Glow -->
    <linearGradient id="studioLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Deep Emboss Drop Shadow -->
    <filter id="goldEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fef08a" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&amp;family=Noto+Nastaliq+Urdu:wght@700&amp;display=swap');
    .gold-arabic { font-family: 'Amiri', 'Traditional Arabic', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
    .gold-urdu { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif; fill: url(#goldGrad); filter: url(#goldEmboss); font-weight: bold; }
  </style>

  <!-- 1. Rich Leather Hardcover Base -->
  <rect width="400" height="600" rx="8" fill="url(#leatherGrad)" />

  <!-- 2. Spine Shadow & Book Crease (Left Edge) -->
  <rect x="0" y="0" width="28" height="600" rx="8" fill="#000000" opacity="0.35" />
  <line x1="28" y1="0" x2="28" y2="600" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="32" y1="0" x2="32" y2="600" stroke="#000000" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 3. Triple Gilded Frame (Islamic Geometric Borders) -->
  <rect x="36" y="20" width="344" height="560" rx="4" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <rect x="44" y="28" width="328" height="544" rx="3" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="8 4" />
  <rect x="49" y="33" width="318" height="534" rx="2" fill="none" stroke="url(#goldBorder)" stroke-width="0.8" />

  <!-- 4. Classical Corner Arcs & Arabesque Ornaments -->
  <!-- Top-Left -->
  <path d="M 49 53 A 20 20 0 0 1 69 33 L 49 33 Z" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="56" cy="40" r="2.5" fill="#ffffff" />
  <!-- Top-Right -->
  <path d="M 367 53 A 20 20 0 0 0 347 33 L 367 33 Z" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="360" cy="40" r="2.5" fill="#ffffff" />
  <!-- Bottom-Left -->
  <path d="M 49 547 A 20 20 0 0 0 69 567 L 49 567 Z" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="56" cy="560" r="2.5" fill="#ffffff" />
  <!-- Bottom-Right -->
  <path d="M 367 547 A 20 20 0 0 1 347 567 L 367 567 Z" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="360" cy="560" r="2.5" fill="#ffffff" />

  <!-- 5. Top Quranic Cartouche: Bismillah -->
  <g transform="translate(208, 95)">
    <rect x="-115" y="-22" width="230" height="44" rx="22" fill="#022c22" stroke="url(#goldBorder)" stroke-width="1.8" />
    <text text-anchor="middle" y="7" class="gold-arabic" font-size="20" letter-spacing="1">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  </g>

  <!-- 6. Central Sunburst Medallion (Shamsah / Islamic Star Centerpiece) -->
  <g transform="translate(208, 255)">
    <!-- Outer Gilded Sunburst Ring -->
    <circle cx="0" cy="0" r="92" fill="#022c22" stroke="url(#goldBorder)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="84" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="78" fill="#011b15" stroke="url(#goldBorder)" stroke-width="1.8" />

    <!-- 8-Pointed Star Points (Octagram) -->
    <polygon points="0,-82 18,-60 48,-68 45,-38 72,-25 54,0 72,25 45,38 48,68 18,60 0,82 -18,60 -48,68 -45,38 -72,25 -54,0 -72,-25 -45,-38 -48,-68 -18,-60" fill="url(#goldGrad)" opacity="0.25" />

    <!-- Main Title: Al-Quran Al-Kareem -->
    <text text-anchor="middle" y="-6" class="gold-arabic" font-size="34" font-weight="900">القُرْآنُ</text>
    <text text-anchor="middle" y="32" class="gold-arabic" font-size="30" font-weight="900">الكَرِيمُ</text>
  </g>

  <!-- 7. Subtitle Cartouche: Mushaf & Calligraphy -->
  <g transform="translate(208, 400)">
    <rect x="-125" y="-18" width="250" height="36" rx="10" fill="#022c22" stroke="url(#goldBorder)" stroke-width="1.2" />
    <text text-anchor="middle" y="5" class="gold-arabic" font-size="16">مُصْحَفُ المَدِينَةِ النَّبَوِيَّةِ المُنَوَّرَةِ</text>
  </g>

  <!-- 8. Urdu Title & Description -->
  <g transform="translate(208, 460)">
    <text text-anchor="middle" y="0" class="gold-urdu" font-size="18">کلامُ اللہ جل جلالہ</text>
    <text text-anchor="middle" y="30" class="gold-urdu" font-size="13" fill="#fef08a" opacity="0.9">مکمل ۱۱۴ سورتیں • ۳۰ پارے مع اعراب و ترجمہ</text>
  </g>

  <!-- 9. Bottom Institution Emblem / Seal -->
  <g transform="translate(208, 528)">
    <rect x="-95" y="-14" width="190" height="28" rx="8" fill="#011c15" stroke="url(#goldBorder)" stroke-width="1" />
    <text text-anchor="middle" y="4" class="gold-urdu" font-size="12">تحریکِ ایمان ڈیجیٹل کتب خانہ</text>
  </g>

  <!-- 10. Studio Lighting / Vignette Overlay -->
  <rect width="400" height="600" rx="8" fill="url(#studioLight)" pointer-events="none" />
</svg>
